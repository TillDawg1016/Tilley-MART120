<html>
    <head>
        <title>ThirdPage</title>

        <script>
		    function checkit(){
			    if(document.getElementById("firstname").value == ""){
				    document.getElementById("firstname").style.backgroundColor = "red"
                    document.getElementById("required1").innerHTML = "* required"
			    }
                if(document.getElementById("lastname").value == ""){
				    document.getElementById("lastname").style.backgroundColor = "red"
                    document.getElementById("required2").innerHTML = "* required"
			    }
                if(document.getElementById("email").value == ""){
				    document.getElementById("email").style.backgroundColor = "red"
                    document.getElementById("required3").innerHTML = "* required"
			    }
                if(document.getElementById("yes").checked == ""){
                    document.getElementById("required4").innerHTML = "* required"
			    }
		    }
	    </script>
    </head>

    <body>
        <h1>Contact Us</h1>
        <p>
            <form>
                First Name:<input type = "text" id = "firstname"><span id = "required1"></span>
                <br>
                Last Name:<input type = "text" id = "lastname"><span id = "required2"></span>
                <br> 
                Email:<input type = "text" id = "email"><span id = "required3"></span>
                <br>
                Terms of Agreement: Don't suck. Be rad. Stay fresh.
                <br>
                Do you agree? Yes<input type = "radio" name = "pick" id = "yes">
                No<input type = "radio" name = "pick" id = "no"><span id = "required4"></span>
                <br>
                <button type="button" onclick = "checkit()">You're Done!</button>
            </form>
        </p>
        <p>
            <a href = "index.html">Home Page</a>
            <br>
            <a href = "SecondPage.html">Good Night Gorilla</a>
        </p>
    </body>


</html
